# Fragments layered on top of BR2_LINUX_KERNEL_USE_ARCH_DEFAULT_CONFIG (the
# stock arm64 defconfig), matching how upstream Buildroot's beagleplay_defconfig
# boots this board. Unlike br2-external/board/ultima-rpi5/kernel-fragments.cfg,
# this file does NOT attempt aggressive boot-time trimming (disabling KVM, NFS,
# ftrace, KASLR, etc.) — those RPi5 disables were only safe because they were
# verified against real bcm2712 hardware one at a time. Do the same exercise
# here once BeaglePlay hardware is available; don't blindly port RPi5's disable
# list onto a different SoC's defconfig.

# Disable module compression (BusyBox modprobe can't handle .ko.xz) — same
# constraint as RPi5, applies to any BusyBox-init Buildroot target.
CONFIG_MODULE_COMPRESS_NONE=y
# CONFIG_MODULE_COMPRESS_XZ is not set

# Display — TI DSS7/tidss DRM driver (AM625 built-in display subsystem, drives
# the HDMI bridge). DRM_FBDEV_EMULATION exposes /dev/fb0 on top of the KMS
# driver, which is what Qt5's linuxfb QPA plugin needs — see "Rendering: Why
# Software, Not GPU" in SETUP-BEAGLEPLAY.md for why this targets linuxfb
# instead of eglfs/KMS+GPU like RPi5.
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_TIDSS=y
CONFIG_FB=y

# USB HID for touchscreen (same Waveshare-style USB touch panel as RPi5)
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_USB_COMPOSITE=y

# WiFi — onboard TI WL1807 (WiLink8) over SDIO, wlcore/wl18xx driver.
# Buildroot ships the firmware via BR2_PACKAGE_LINUX_FIRMWARE_TI_WL18XX;
# unlike RPi5's brcmfmac, nothing needs to be manually placed in the overlay.
CONFIG_WIRELESS=y
CONFIG_RFKILL=y
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_WLCORE=m
CONFIG_WLCORE_SDIO=m
CONFIG_WL18XX=m

# SocketCAN + gs_usb driver for ODrive USB-CAN adapter (Syvecs S7+ CAN2) —
# identical to RPi5's fragment. BeaglePlay's onboard MCAN0 is NOT used (no
# onboard transceiver; would need an external transceiver cape) — see
# "CAN Bus Integration" in SETUP-BEAGLEPLAY.md.
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_DEV=y
CONFIG_CAN_GS_USB=y

# FAT/VFAT filesystem — needed to mount the boot partition for debug logs
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y

# Battery-backed RTC — BeaglePlay has an onboard BQ32002 (CR1220 coin cell,
# board's RTC battery holder), on-chip at i2c address 0x68, already wired up
# in the mainline k3-am625-beagleplay.dts (present since it was upstreamed,
# well before this board's v6.10 pin — no DT overlay needed). RPi5 has no
# such hardware; ultima-app's SystemClock stays board-agnostic by probing
# for /dev/rtc0 at runtime and no-op'ing when it's absent, same pattern as
# CanBus probing for can0.
#
# RTC_HCTOSYS pushes the RTC's time into the system clock during kernel
# boot, before any userspace runs — this board launches the app before udev
# for boot speed (see S00remountro), so anything that waited for a udev
# rule or an init-script hwclock call would race the app's own startup.
# Doing the read this way sidesteps that entirely.
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_BQ32K=y
CONFIG_RTC_HCTOSYS=y
