# Fragments layered on top of BR2_LINUX_KERNEL_USE_ARCH_DEFAULT_CONFIG (the
# stock arm64 defconfig), matching how upstream Buildroot's beagleplay_defconfig
# boots this board.

# Disable module compression (BusyBox modprobe can't handle .ko.xz) — same
# constraint as RPi5, applies to any BusyBox-init Buildroot target.
CONFIG_MODULE_COMPRESS_NONE=y
# CONFIG_MODULE_COMPRESS_XZ is not set

# Display — TI DSS7/tidss DRM driver (AM625 built-in display subsystem, drives
# the HDMI bridge). DRM_FBDEV_EMULATION exposes /dev/fb0 on top of the KMS
# driver, which is what Qt5's linuxfb QPA plugin needs — see "Rendering: Why
# Software, Not GPU" in SETUP-BEAGLEPLAY.md for why this targets linuxfb
# instead of eglfs/KMS+GPU like RPi5.
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_TIDSS=y
CONFIG_FB=y

# USB HID for touchscreen (same Waveshare-style USB touch panel as RPi5)
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_USB_COMPOSITE=y

# WiFi — onboard TI WL1807 (WiLink8) over SDIO, wlcore/wl18xx driver.
# Buildroot ships the firmware via BR2_PACKAGE_LINUX_FIRMWARE_TI_WL18XX;
# unlike RPi5's brcmfmac, nothing needs to be manually placed in the overlay.
CONFIG_WIRELESS=y
CONFIG_RFKILL=y
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_WLCORE=m
CONFIG_WLCORE_SDIO=m
CONFIG_WL18XX=m

# SocketCAN + gs_usb driver for ODrive USB-CAN adapter (Syvecs S7+ CAN2) —
# identical to RPi5's fragment. BeaglePlay's onboard MCAN0 is NOT used (no
# onboard transceiver; would need an external transceiver cape) — see
# "CAN Bus Integration" in SETUP-BEAGLEPLAY.md.
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_DEV=y
CONFIG_CAN_GS_USB=y

# FAT/VFAT filesystem — needed to mount the boot partition for debug logs
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_FAT_FS=y
CONFIG_VFAT_FS=y

# Disable the PowerVR GPU driver (fd00000.gpu, "ti,am62-gpu" / "img,img-axe").
# Not used — this build renders in software (linuxfb + Qt Quick software
# backend, see "Rendering: Why Software, Not GPU" in SETUP-BEAGLEPLAY.md) and
# Buildroot ships no firmware for it. Left enabled (=m, the arch-default
# setting), it still probes on every boot and burns ~2s failing before tidss
# gets its turn — confirmed on real hardware as a real contributor to the
# /dev/fb0 boot race in S00remountro. With no driver built, no probe is
# attempted at all — the device node just sits unbound instantly instead of
# timing out.
# CONFIG_DRM_POWERVR is not set

# Battery-backed RTC — BeaglePlay has an onboard BQ32002 (CR1220 coin cell,
# board's RTC battery holder), on-chip at i2c address 0x68, already wired up
# in the mainline k3-am625-beagleplay.dts (present since it was upstreamed,
# well before this board's v6.10 pin — no DT overlay needed). RPi5 has no
# such hardware; ultima-app's SystemClock stays board-agnostic by probing
# for /dev/rtc0 at runtime and no-op'ing when it's absent, same pattern as
# CanBus probing for can0.
#
# RTC_HCTOSYS pushes the RTC's time into the system clock during kernel
# boot, before any userspace runs — this board launches the app before udev
# for boot speed (see S00remountro), so anything that waited for a udev
# rule or an init-script hwclock call would race the app's own startup.
# Doing the read this way sidesteps that entirely.
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_BQ32K=y
CONFIG_RTC_HCTOSYS=y

# Boot-time kernel trimming (2026-08-07) — same idea as
# br2-external/board/ultima-rpi5/kernel-fragments.cfg's disable list, but not
# blindly copied: checked each one against this SoC's own Kconfig dependency
# graph first (e.g. DRM_TIDSS, unlike RPi5's DRM_VC4, has no dependency on
# CONFIG_SOUND, so that one's safe to cut here even though RPi5 can't; SCSI
# here is only pulled in by USB mass-storage/image class drivers we don't
# use, confirmed by grepping drivers/usb/{storage,image}/Kconfig). All =y
# built-in on the untrimmed arch defconfig before this; disabling them means
# no probe/init code runs for them at all instead of them sitting there
# unused. Hardware-verified: boots clean, app starts normally, no dmesg
# errors.
# CONFIG_KVM is not set
# CONFIG_BT is not set
# CONFIG_NFS_FS is not set
# CONFIG_NFSD is not set
# CONFIG_SUNRPC is not set
# CONFIG_ISCSI_TCP is not set
# CONFIG_ISCSI_BOOT_SYSFS is not set
# CONFIG_SCSI is not set
# CONFIG_BLK_DEV_LOOP is not set
# CONFIG_BLK_DEV_RAM is not set
# CONFIG_BLK_DEV_BSG is not set
# CONFIG_RC_CORE is not set
# CONFIG_MEDIA_CEC_SUPPORT is not set
# CONFIG_VIDEO_DEV is not set
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_FTRACE is not set
# CONFIG_RANDOMIZE_BASE is not set
# CONFIG_TASKSTATS is not set
# CONFIG_AUDIT is not set
# CONFIG_PROFILING is not set
# CONFIG_PERF_EVENTS is not set
# CONFIG_DEBUG_FS is not set
# CONFIG_KALLSYMS is not set
# CONFIG_IOSCHED_BFQ is not set
# CONFIG_MQ_IOSCHED_KYBER is not set
# CONFIG_VGA_ARB is not set
# CONFIG_QUOTA is not set
# CONFIG_PPS is not set
# CONFIG_PTP_1588_CLOCK is not set

# Sound — unlike RPi5 (DRM_VC4 depends on SND/SND_SOC for HDMI audio),
# tidss has no such dependency (confirmed against drivers/gpu/drm/tidss/Kconfig)
# and this project doesn't use HDMI audio, so this is a clean cut here.
# CONFIG_SOUND is not set
# CONFIG_SND is not set

# Wired ethernet USB dongle drivers (AX88179, SMSC95XX, etc.) — not MACB,
# which doesn't apply to this SoC at all (BeaglePlay's real wired ethernet
# is TI_K3_AM65_CPSW_NUSS, a separate driver — deliberately left alone, see
# note in SETUP-BEAGLEPLAY.md's Open Questions). These are just the modular
# "in case some random USB-to-Ethernet adapter gets plugged in" drivers,
# never loaded automatically, unrelated to onboard hardware.
# CONFIG_USB_NET_DRIVERS is not set
