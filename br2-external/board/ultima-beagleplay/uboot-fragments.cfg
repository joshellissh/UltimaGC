# Fragment layered on top of the am62x_beagleplay_a53 U-Boot defconfig.
#
# CONFIG_BOOTDELAY=2 is the stock default — U-Boot waits 2s at every boot
# for a keypress to interrupt autoboot before running CONFIG_BOOTCOMMAND.
# Nothing ever needs to interrupt autoboot on a headless embedded dash, so
# this is pure waste on every single boot. 0 means autoboot immediately,
# no countdown, no window to interrupt it.
CONFIG_BOOTDELAY=0

# U-Boot proper still prints its full banner + SD/MMC/boot-progress lines to
# the 115200 UART on every boot (CONFIG_LOGLEVEL=4, SPL_BANNER_PRINT=y,
# nothing silenced) even though bootdelay=0 already means there's no
# interactive prompt for anyone to read them on. SILENT_CONSOLE gates all
# of that on the env var 'silent' (set to 1 by default via a patch to
# beagleplay.env — see patches/uboot/); SILENT_U_BOOT_ONLY keeps it scoped
# to U-Boot itself so the kernel's own console/earlycon (relied on by
# S00remountro's UART timing marker, see SETUP-BEAGLEPLAY.md) is untouched.
# Not wired up for the R5 SPL stage (ti-k3-r5-loader): Buildroot's package
# for it only supports using the stock board defconfig as-is or replacing
# it wholesale with a hand-maintained full copy (no fragment-file layering
# like this package has) — forking the whole upstream defconfig just to
# silence a two-line SPL banner isn't worth the ongoing maintenance cost.
CONFIG_SILENT_CONSOLE=y
CONFIG_SPL_SILENT_CONSOLE=y
CONFIG_SILENT_U_BOOT_ONLY=y
