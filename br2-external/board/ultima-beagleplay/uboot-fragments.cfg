# Fragment layered on top of the am62x_beagleplay_a53 U-Boot defconfig.
#
# CONFIG_BOOTDELAY=2 is the stock default — U-Boot waits 2s at every boot
# for a keypress to interrupt autoboot before running CONFIG_BOOTCOMMAND.
# Nothing ever needs to interrupt autoboot on a headless embedded dash, so
# this is pure waste on every single boot. 0 means autoboot immediately,
# no countdown, no window to interrupt it.
CONFIG_BOOTDELAY=0
