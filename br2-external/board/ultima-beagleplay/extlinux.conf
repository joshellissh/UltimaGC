# root=/dev/mmcblk1p2 assumes SD card boot (mmcblk1), matching upstream
# Buildroot's beagleplay_defconfig extlinux.conf. BeaglePlay also has onboard
# eMMC, which enumerates as mmcblk0 and is the no-button-held default boot
# device — TODO verify against real hardware which device this build targets
# and adjust both this line and S00remountro's partition numbers to match.
label ultima-beagleplay
    kernel /Image
    fdtdir /
    devicetree /k3-am625-beagleplay.dtb
    append console=ttyS2,115200n8 root=/dev/mmcblk1p2 rootwait ro rootfstype=ext4 earlycon=ns16550a,mmio32,0x02800000 loglevel=1 quiet logo.nologo vt.global_cursor_default=0 numa=off nokaslr
