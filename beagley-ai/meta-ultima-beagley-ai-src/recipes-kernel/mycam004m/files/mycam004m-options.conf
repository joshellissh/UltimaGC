# mycam004m module options.
#
# fps=25: the attached camera (the discrete GC2053-class cam from the
# surround-view kit, wired straight into MY-CAM004M input 0) outputs AHD
# 1080p at 25fps (PAL), not 30. The driver's compiled-in default is fps=30
# (AHD_MD=0x02); at that setting these cameras only half-lock (NOVID clears
# but H_LOCK stays 0 — no usable video). fps=25 programs AHD_MD=0x03
# (1080p25), which gives full lock and frames — hardware-verified on this
# board 2026-08-31 (first as a live /etc edit on the bench, now baked in).
#
# autorate=0: the attached camera is fixed 1080p25 (fps=25 above), so the
# rate watchdog has nothing to search for — and it actively harms here. The
# N4's horizontal lock is stochastically marginal on this board (a stable
# ~2px/line shear that H_LOCK does NOT flag — see mycam004m.c
# mycam004m_relock_afe()); on a transient unlocked poll the watchdog flips
# 25p<->30p, and the wrong-rate decode IS that shear ("clean for a few
# seconds then melty", root-caused 2026-09-01). With the watchdog off, a
# clean lock holds, and ultima-app's measure-and-relock loop (the driver's
# "relock" sysfs attr) is what recovers a bad lock instead.
#
# modules-load.d/mycam004m.conf autoloads the module via
# systemd-modules-load -> modprobe, which reads this options line.
options mycam004m fps=25 autorate=0
