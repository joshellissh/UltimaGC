# Both mycam004m modules are out-of-tree, so — same as pvrsrvkm (see
# ultima-app.bb's pvrsrvkm.conf comment) — nothing coldplugs them
# automatically; force both. Loading both is harmless: the real driver's I2C
# probe just fails cleanly (dmesg: no ACK / no such device) if no MY-CAM004M
# is cabled to CSI0 yet, and mycam004m-select-backend.service (not this file)
# decides which one /dev/mycam/cam1..4 actually points at.
#
# The real backend's in-tree CSI stack (j721e-csi2rx + cdns-dphy-rx; modprobe
# pulls cdns-csi2rx in as j721e-csi2rx's dependency) is DT-instantiated
# platform drivers whose udev coldplug proved raceable on the bench
# (2026-08-31: the first real-backend boot ran mycam004m-select-backend.service
# before a single ticsi2rx capture node existed). Force them here too so the
# v4l2-async media graph starts assembling at systemd-modules-load time —
# mycam004m-configure-pipeline.sh still waits for the graph to *finish*, but
# this makes that wait short and deterministic.
j721e-csi2rx
cdns-dphy-rx
mycam004m
mycam004m-fake
