# 3 AHD cameras are wired to the NVP6324 (CH0-CH2) as of 2026-09-14. vc_mask
# must match what's actually populated: enabling a VC with no camera makes
# the MIPI arbiter interleave that free-running channel in with the real
# ones and every frame splits into two DMA buffers (fps doubles, image tears
# into two bands) -- see camdriver/nvp6324-framing-findings.md. The driver's
# own default (vc_mask=0x1, VC0 only) is deliberately conservative for
# unknown hardware; this board-specific override is what actually matches
# this car's wiring.
#
# mipi_mclk=756 is REQUIRED for 3 cameras. The driver default 594 Mbps/lane is
# tuned+proven for ONE 1080p camera (~207 Mbps/lane); three 1080p25 UYVY streams
# need ~621 Mbps/lane, so at 594 the MIPI link oversubscribes -> the cdns CSI-RX
# stream FIFOs overflow and frames shred into green static (hardware-verified
# 2026-09-14: ~42k truncated-header/s + FIFO overflow at 594/3cam). 756 has the
# bandwidth with ~22% margin AND a clean eye (0 CRC/s, 0 overflow streaming);
# 1242 (the chip's 4ch rate) also has the bandwidth but a marginal eye on this
# board's CSI path (~76k CRC/s -> diagonal shear). link_freq_idx=4 is the RX
# D-PHY band the driver pairs with 756 (see the driver's link_freq comment;
# 1242->0, 756->4, 594->6). 4 cameras would need ~828 Mbps/lane (>756) -> 1242,
# where the eye must first be tuned; revisit for a 4-cam build.
options nvp6324 vc_mask=0x7 mipi_mclk=756 link_freq_idx=4
