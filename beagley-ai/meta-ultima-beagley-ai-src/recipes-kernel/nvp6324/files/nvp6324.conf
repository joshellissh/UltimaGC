# 4 AHD cameras are wired to the NVP6324 (CH0-CH3) as of 2026-09-15. vc_mask
# must match what's actually populated: enabling a VC with no camera makes
# the MIPI arbiter interleave that free-running channel in with the real
# ones and every frame splits into two DMA buffers (fps doubles, image tears
# into two bands) -- see camdriver/nvp6324-framing-findings.md. The driver's
# own default (vc_mask=0x1, VC0 only) is deliberately conservative for
# unknown hardware; this board-specific override matches this car's wiring
# (all four channels populated). vc_mask=0xF = VC0-VC3.
#
# mipi_mclk=1049 is the MULTI-CAMERA rate for THIS board (hardware-verified
# 2026-09-15: all 4x 1080p25 UYVY streaming 25fps, clean headers, no FIFO
# overflow). It is a narrow window: the TX PLL does not work below it in /1
# mode (993 = 10x more errors, lower = overflow) and the Cadence CSI-RX gets
# worse above it; 756 (the vendor 720P profile) destroys packet sync, and the
# whole 1200-1350 RX band (1242..1366) overflows or delivers unparsed garbage.
# link_freq_idx=1 is the RX D-PHY band that pairs with 1049 (500 MHz/1000 Mbps;
# the 1040-1200 band measured 50% worse). Residual ~0.07 CRC/line (4 cams) = a
# single word slipped near the start of a line, inside the NVP6324 MIPI TX
# after the CRC is computed; shows as slight +-2 px edge wobble. The one
# register that helps (the TX HS resistor trim, bank 0x21 reg 0x08 bit7, 3x)
# is baked into the driver. Multi-line arbiter packets cut it further but the
# J722S receiver DMA lays each packet at its own offset (picture becomes
# shifted stripes), so packets must stay one line. No module parameter changes
# the residual. Full derivation: camdriver/nvp6324-framing-findings.md and the
# 1049 PLL table comment in nvp6324.c.
options nvp6324 vc_mask=0xF mipi_mclk=1049 link_freq_idx=1
