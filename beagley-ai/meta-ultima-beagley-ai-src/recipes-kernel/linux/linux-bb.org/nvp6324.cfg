# CSI-2 capture stack the NVP6324 / MY-CAM004M (CSI0) binds onto — the Cadence
# CSI2RX bridge, the TI SHIM (which does the 4-virtual-channel -> 4x /dev/videoN
# demux), the Cadence D-PHY RX, and the V4L2/Media-Controller core.
#
# All of these are already =m/=y in the current bb.org defconfig; asserted here
# so a future defconfig change can't silently drop the camera capture path
# (same belt-and-suspenders reasoning as the explicit ti-img-rogue-driver
# IMAGE_INSTALL entry). The NVP6324 driver itself is an out-of-tree module
# (recipes-kernel/nvp6324); this fragment only pins the in-tree stack.
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=m
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_CADENCE_CSI2RX=m
CONFIG_VIDEO_TI_J721E_CSI2RX=m
CONFIG_PHY_CADENCE_DPHY=y
CONFIG_PHY_CADENCE_DPHY_RX=m
