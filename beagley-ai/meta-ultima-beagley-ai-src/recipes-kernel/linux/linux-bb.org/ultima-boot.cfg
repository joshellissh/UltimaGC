# Boot-time trims for the bb.org 6.12 kernel on the BeagleY-AI (2026-08-30).
#
# bb.org_defconfig is a kitchen-sink distro config: 2325 built-in options,
# 2900 modules, a 40 MiB uncompressed Image that the R5 SPL streams off the
# SD card at ~20 MB/s under falcon boot. Everything below was chosen from an
# initcall_debug-timed falcon boot (beagleplay-falcon/NOTES.md, "BeagleY-AI
# boot-time work"), not from taste. Merged on top of the defconfig by
# setup-defconfig.inc's KERNEL_CONFIG_FRAGMENTS handling, then `oldconfig`
# resolves the dependents.

# --- Measured: 1.27 s of init_kprobe_trace at late_initcall (kallsyms walk
# for the kprobe blacklist on a kernel this size). Nothing on the dash uses
# kprobes/uprobes or the function tracer; the latter also patches every
# mcount call site before the console is even up.
# CONFIG_KPROBES is not set
# CONFIG_UPROBES is not set
# CONFIG_KPROBE_EVENTS is not set
# CONFIG_UPROBE_EVENTS is not set
# CONFIG_FUNCTION_TRACER is not set
# CONFIG_DYNAMIC_FTRACE is not set
# CONFIG_STACK_TRACER is not set
# CONFIG_FTRACE_SYSCALLS is not set
# CONFIG_FTRACE is not set
# CONFIG_BLK_DEV_IO_TRACE is not set
# CONFIG_KALLSYMS_ALL is not set

# --- Per-allocation / per-page runtime hardening and debug that a
# single-purpose dash gets nothing from.
# CONFIG_INIT_ON_ALLOC_DEFAULT_ON is not set
# CONFIG_KFENCE is not set
# CONFIG_DEBUG_LIST is not set
# CONFIG_PAGE_POISONING is not set
# CONFIG_SLUB_DEBUG is not set
# CONFIG_SHUFFLE_PAGE_ALLOCATOR is not set
# CONFIG_SLAB_FREELIST_RANDOM is not set
# CONFIG_DYNAMIC_DEBUG is not set
# KASLR: the whole Image is relocated at boot for it.
# CONFIG_RANDOMIZE_BASE is not set

# --- LSMs / integrity / audit: SELinux, AppArmor, TOMOYO, IMA/EVM all
# initialise at boot (IMA's "evm: overlay not supported" is in every log)
# and none is configured. systemd copes with audit being absent.
# CONFIG_SECURITY_SELINUX is not set
# CONFIG_SECURITY_APPARMOR is not set
# CONFIG_SECURITY_TOMOYO is not set
# CONFIG_SECURITY_YAMA is not set
# CONFIG_IMA is not set
# CONFIG_EVM is not set
# CONFIG_INTEGRITY is not set
# CONFIG_AUDIT is not set

# --- Never used on this board; falcon boot has no EFI/GRUB stage anymore.
# CONFIG_HIBERNATION is not set
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set
# CONFIG_EFI is not set
# CONFIG_ZSWAP is not set
# CONFIG_HUGETLBFS is not set
# CONFIG_VIRTIO is not set
# CONFIG_KVM is not set
# CONFIG_MPTCP is not set
# CONFIG_DRM_AMDGPU is not set

# --- PCIe: the board DT leaves serdes_wiz1 disabled (see the USB1 patch in
# this directory), so the j721e-pcie host probes, fails on its PHY, and is
# retried by every deferred-probe pass — visible as repeated "host bridge
# ranges" lines and part of deferred_probe_initcall's 0.39 s. No PCIe device
# exists on the dash.
# CONFIG_PCI is not set

# --- Filesystems, RAID and device-mapper the dash never mounts: the root is
# ext4, the boot partition FAT, /data ext4. Each of these still runs its
# initcall and registers with VFS on every boot.
# CONFIG_XFS_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_F2FS_FS is not set
# CONFIG_NFS_FS is not set
# CONFIG_NFSD is not set
# CONFIG_CEPH_FS is not set
# CONFIG_CIFS is not set
# CONFIG_9P_FS is not set
# CONFIG_NET_9P is not set
# CONFIG_GFS2_FS is not set
# CONFIG_OCFS2_FS is not set
# CONFIG_NILFS2_FS is not set
# CONFIG_ZONEFS_FS is not set
# CONFIG_EROFS_FS is not set
# CONFIG_JFFS2_FS is not set
# CONFIG_UBIFS_FS is not set
# CONFIG_AUTOFS_FS is not set
# CONFIG_NTFS3_FS is not set
# CONFIG_UDF_FS is not set
# CONFIG_MD is not set
# CONFIG_BLK_DEV_DM is not set
# CONFIG_BCACHE is not set

# --- Modules are installed .ko.xz by default and every one of the ~50 that
# load at boot is decompressed on the way in (pvrsrvkm alone is 1.8 MiB).
# Storage is a 238 GiB card; trade the space for the time.
# CONFIG_MODULE_COMPRESS is not set

# --- Things the dash needs before udev's coldplug has run. Built in, so the
# touchscreen (hid-multitouch + evdev, which Qt's eglfs input reads) and the
# MCAN bus are there the moment the kernel is, with no module load on the
# critical path.
CONFIG_INPUT_EVDEV=y
CONFIG_HID_MULTITOUCH=y
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_DEV=y
CONFIG_CAN_M_CAN=y
CONFIG_CAN_M_CAN_PLATFORM=y

# --- Entropy. The kernel's CRNG only became ready at ~3.4 s (dmesg "random:
# crng init done", after a 0.9 s silent gap), and Qt's hash-seed setup calls
# getrandom(), which blocks until then — ultima-app's main() sat at exactly
# that timestamp on every boot no matter how early it was exec'd or how much
# was prefetched. The SoC's TRNG sits behind OP-TEE (SA2UL firewalled to
# secure world), reachable as a hwrng through the optee_rng driver; with
# TEE/OP-TEE/optee_rng as modules that only happened at udev coldplug, i.e.
# after the app. Built in, the hwrng feeds the pool from early boot.
CONFIG_TEE=y
CONFIG_OPTEE=y
CONFIG_HW_RANDOM_OPTEE=y
