BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "ultima-beagley-ai"
BBFILE_PATTERN_ultima-beagley-ai = "^${LAYERDIR}/"
BBFILE_PRIORITY_ultima-beagley-ai = "10"
LAYERSERIES_COMPAT_ultima-beagley-ai = "scarthgap"
# ultima-beagleplay: this layer's .bbappends extend recipes (ultima-app.bb)
# that live there, not just co-exist alongside it.
LAYERDEPENDS_ultima-beagley-ai = "core qt5-layer ultima-beagleplay"
