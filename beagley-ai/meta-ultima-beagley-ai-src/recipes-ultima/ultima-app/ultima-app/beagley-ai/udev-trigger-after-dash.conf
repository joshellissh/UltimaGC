# Installed as /etc/systemd/system/systemd-udev-trigger.service.d/
# ultima-after-dash.conf (beagley-ai only). udev's coldplug replays every
# device's add event, which on this board loads ~50 modules (WiFi, sound,
# video codecs, remoteproc for two DSPs and two R5s plus their firmware,
# ...) and it all landed in the same 5 s window in which ultima-app was
# loading Qt, Mesa and the GPU firmware off the same SD card. ultima-app is
# Type=notify and signals READY=1 from its first rendered frame, so this
# ordering means: dash on screen first, then the rest of the world.
#
# Everything the dash itself needs before coldplug is built into the
# kernel (tidss/it66121 display, evdev + hid-multitouch for the touchscreen,
# MCAN) or force-loaded by systemd-modules-load (pvrsrvkm) — see
# recipes-kernel/linux/linux-bb.org/ultima-boot.cfg. udevd itself is not
# delayed, only the coldplug replay, so hotplugged devices are still handled
# immediately.
[Unit]
After=ultima-app.service
