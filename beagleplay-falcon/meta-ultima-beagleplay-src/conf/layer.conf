BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "ultima-beagleplay"
BBFILE_PATTERN_ultima-beagleplay = "^${LAYERDIR}/"
BBFILE_PRIORITY_ultima-beagleplay = "10"
LAYERSERIES_COMPAT_ultima-beagleplay = "scarthgap"
LAYERDEPENDS_ultima-beagleplay = "core qt5-layer"

# Bluetooth (2026-08-19): arago's base distro doesn't turn this on by
# default. bluez5 itself builds either way, but several recipes gate their
# own Bluetooth support on this feature being present — notably
# qtconnectivity, whose PACKAGECONFIG only pulls in its bluez backend
# (QT += bluetooth in ultima-app.pro) when DISTRO_FEATURES has "bluetooth"
# (see meta-qt5/recipes-qt/qt5/qtconnectivity_git.bb). Set here rather than
# in local.conf: local.conf lives only inside the Docker build volume, not
# in git (see build.sh) — this way a fresh volume gets it automatically.
DISTRO_FEATURES:append = " bluetooth"
