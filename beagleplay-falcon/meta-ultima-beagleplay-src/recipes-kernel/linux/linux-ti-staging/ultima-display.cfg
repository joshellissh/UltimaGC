# tidss (the AM625 display/DRM driver, and the thing that creates /dev/fb0
# for Qt's linuxfb QPA plugin) ships as a module here (CONFIG_DRM_TIDSS=m in
# this kernel's arago defconfig). ultima-app crash-looped continuously on
# real hardware (SIGABRT, Qt's "no platform plugin could be initialized"
# pattern) with zero "tidss"/fb0 lines ever appearing in several minutes of
# boot log — consistent with the module simply never getting auto-loaded,
# not a transient probe race (Restart=on-failure alone never recovered it).
#
# The now-removed Buildroot BeaglePlay port hit the same class of problem
# and worked around it by making tidss built-in and disabling PowerVR
# outright, on the theory that tidss was racing/losing against PowerVR.
# Applying the same fix here first, rather than chasing a module-autoload
# mechanism (systemd-udevd module coldplug/depmod) that may or may not be
# the actual problem, is what led to the two lines below.
#
# Root-caused 2026-08-09: this =y request was silently downgraded back to
# =m every build, because CONFIG_DRM=m and CONFIG_DRM_KMS_HELPER=m (arago's
# base defconfig) capped it — a bool/tristate can't be builtin while its
# parent is modular. Confirmed directly against the built .config in the
# Yocto volume, not guessed. Same story for the IT66121 HDMI bridge chip
# (CONFIG_DRM_ITE_IT66121), which the tidss "component" framework has to
# wait for at runtime if it's a separate module — building it in too moves
# the whole dss->bridge->connector probe chain into early kernel init
# instead of stalling until systemd's "Load Kernel Modules" step.
#
# Correction (2026-08-12): the "racing/losing against PowerVR" framing above
# was a misdiagnosis, not just imprecise. Read directly against this
# kernel's source: drivers/gpu/drm/Kconfig has zero `choice` blocks under
# drivers/gpu/ at all, and upstream's own arm64 defconfig sets
# CONFIG_DRM_TIDSS=m and CONFIG_DRM_POWERVR=m *together* — they are
# independent tristates, never in competition. CONFIG_DRM=m capping
# CONFIG_DRM_TIDSS was the entire mechanism; CONFIG_DRM_POWERVR being unset
# never had anything to do with it. See NOTES.md "PowerVR GPU enablement"
# for the full investigation and why # CONFIG_DRM_POWERVR is not set stays
# below regardless — the GPU is now enabled through TI's out-of-tree
# pvrsrvkm.ko instead (ti-img-rogue-driver), which would contend with this
# in-tree symbol for the same GPU device-tree node if both were on.
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_TIDSS=y
CONFIG_DRM_ITE_IT66121=y
CONFIG_DRM_DISPLAY_HELPER=y
CONFIG_DRM_DISPLAY_CONNECTOR=y
# CONFIG_DRM_POWERVR is not set

# A "quiet" kernel cmdline was attempted from here first
# (CONFIG_CMDLINE_EXTEND, to merge it onto whatever U-Boot's falcon SPL
# provides) — dead end, ruled out and moved to a U-Boot patch instead. Left
# as a note so this isn't re-attempted the same way:
#   1. This kernel's arm64 Kconfig has no CMDLINE_EXTEND choice member at
#      all (only CMDLINE_FROM_BOOTLOADER/CMDLINE_FORCE) — setting it was
#      silently a no-op, verified against the built .config, not assumed.
#   2. CMDLINE_FORCE (the only other non-default choice) replaces the
#      *entire* cmdline with a static CONFIG_CMDLINE string, which would
#      have discarded the bootloader-derived root=PARTUUID (this same image
#      boots from both SD and eMMC, each with a different PARTUUID fixed up
#      live by k3_falcon_fdt_fixup() at boot) — would have looked like a
#      bricked board over serial.
# Falcon's cmdline is generated by a fixed snprintf in
# arch/arm/mach-k3/common.c, not read from a file, so the actual fix is a
# small U-Boot patch appending " quiet" to that format string directly —
# see meta-falcon-beagleplay-src's
# 0002-k3_r5_falcon-add-quiet-to-falcon-boot-cmdline.patch.
