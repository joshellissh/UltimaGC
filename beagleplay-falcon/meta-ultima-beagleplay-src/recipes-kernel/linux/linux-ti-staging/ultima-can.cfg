# MikroE CAN SPI 3.3V click (MCP2515 + SN65HVD230) on the mikroBUS header —
# generic SocketCAN can0, reading the Syvecs S7+ ECU's CAN2 bus. Replaces the
# ODrive USB-CAN adapter this project used previously. Device-tree node is
# added by 0001-arm64-dts-k3-am625-beagleplay-add-mikrobus-can-click.patch.
#
# =y, not =m: this is a DT-instantiated SPI device, not a hotplugged USB
# one — udev coldplug module-autoload for DT platform devices has already
# bitten this project once (CONFIG_DRM_TIDSS, see NOTES.md), so avoid the
# whole class of bug by building the driver in rather than trusting coldplug.
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_SPI=y
CONFIG_SPI_OMAP24XX=y
CONFIG_CAN_MCP251X=y
