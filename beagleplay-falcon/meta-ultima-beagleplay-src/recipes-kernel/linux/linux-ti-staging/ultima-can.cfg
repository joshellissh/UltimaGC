# ODrive USB-CAN adapter (gs_usb) — same unit used on RPi5/Buildroot,
# generic SocketCAN can0. Not set by default in linux-ti-staging's arago
# defconfig.
#
# =m, not =y: this kernel's CONFIG_USB is itself modular, so Kconfig's
# oldconfig step silently downgrades a requested "=y" to "=m" anyway
# (confirmed — asking for =y here produced =m in the built .config).
# That's fine on this rootfs, unlike the Buildroot BeaglePlay/RPi5 builds:
# those launch the app *before* udev for boot speed and need the driver
# built in so there's no module-load race; this Yocto rootfs boots
# normally under systemd/udev, which auto-loads gs_usb via its
# MODULE_DEVICE_TABLE alias when the adapter is plugged in.
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_GS_USB=m
