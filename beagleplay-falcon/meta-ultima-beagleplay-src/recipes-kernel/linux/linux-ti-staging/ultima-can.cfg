# MikroE CAN SPI 3.3V click (MCP2515 + SN65HVD230) on the mikroBUS header —
# generic SocketCAN can0, reading the Syvecs S7+ ECU's CAN2 bus. Device-tree
# node is added by
# 0001-arm64-dts-k3-am625-beagleplay-add-mikrobus-can-click.patch.
#
# =y, not =m: this is a DT-instantiated SPI device, not a hotplugged USB
# one — udev coldplug module-autoload for DT platform devices has already
# bitten this project once (CONFIG_DRM_TIDSS, see NOTES.md), so avoid the
# whole class of bug by building the driver in rather than trusting coldplug.
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_SPI=y
CONFIG_SPI_OMAP24XX=y
CONFIG_CAN_MCP251X=y

# ODrive USB-CAN adapter (gs_usb) — temporarily re-added 2026-08-21 for bench
# testing (MCE18 configuration/CAN decode work) while the SPI click isn't
# physically seated on the mikroBUS header yet. Coexists fine with the
# mcp251x config above: since the click isn't connected, its probe never
# registers a netdev (times out with error -110, see NOTES.md), so gs_usb's
# hotplugged interface becomes can0 by default, same name CanBus already
# expects — no udev/app changes needed to pick between them. Once the click
# is seated and verified end-to-end, drop this block and the matching
# 70-can.rules USB entry again.
#
# =m, not =y: this kernel's CONFIG_USB is itself modular, so Kconfig's
# oldconfig step silently downgrades a requested "=y" to "=m" anyway
# (confirmed when this was the only CAN adapter — see git history).
CONFIG_CAN_GS_USB=m
