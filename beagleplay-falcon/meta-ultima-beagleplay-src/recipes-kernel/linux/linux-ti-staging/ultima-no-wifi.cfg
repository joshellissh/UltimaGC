# No WiFi in this build (see CLAUDE.md/GAUGE-CLUSTER.md) — the WL1807 chip
# is physically on the board but its firmware/config was never ported here
# (unlike the Buildroot RPi5/BeaglePlay builds), so wlcore/wl18xx just probe
# the SDIO device, fail to find firmware, and retry 3x, every single boot
# ("wlcore: ERROR could not get firmware ti-connectivity/wl18xx-fw-4.bin"
# in every boot log in beagleplay-falcon/boot-logs/). Confirmed against the
# built .config that these ship as modules (=m, loaded automatically once
# the SDIO device is enumerated), not builtin:
#   CONFIG_WL18XX=m
#   CONFIG_WLCORE=m
#   CONFIG_WLCORE_SDIO=m
# Disabling them is an image-size/pointless-work cleanup, not a first-frame
# fix — the first wlcore error lands well after first frame in every
# measured boot (see NOTES.md "Boot-time investigation" Candidate 5) — but
# it does shrink fitImage, which the R5 SPL reads over eMMC before ATF even
# starts, so smaller is strictly better on that leg.
# CONFIG_WLCORE is not set
# CONFIG_WL18XX is not set
# CONFIG_WLCORE_SDIO is not set
