# WiFi (2026-08-18): the TI WL1807 (WiLink8) chip is physically on the
# board, SDIO-attached — confirmed on real hardware (every prior boot log
# showed wlcore/wl18xx probing the SDIO device and failing only on the
# firmware load: "wlcore: ERROR could not get firmware
# ti-connectivity/wl18xx-fw-4.bin"). This was previously disabled outright
# (see git history: ultima-no-wifi.cfg) purely because the firmware/config
# side was never ported to this Yocto build, not because of a hardware gap.
# CFG80211/MAC80211/RFKILL were already =m in the base tisdk defconfig
# (confirmed via /proc/config.gz on real hardware) — only the WL18xx driver
# stack itself needs enabling here.
#
# These land in the rootfs (kernel-module-wl18xx/-wlcore/-wlcore-sdio
# packages under /lib/modules), not the fitImage the R5 SPL reads
# pre-kernel — kernel-fitimage.bbclass only packs Image+DTB, no modules, no
# initramfs in this build. So unlike the display/CAN fragments above, this
# should have zero effect on the falcon payload-load/ATF-start leg of boot;
# only claim otherwise (as the old ultima-no-wifi.cfg comment did, without a
# measured fitImage size) once it's actually been checked against a build.
CONFIG_WLCORE=m
CONFIG_WLCORE_SDIO=m
CONFIG_WL18XX=m
