# mycam004m module options.
#
# fps=25: the attached surround-view cameras (Amazon "BY-J 360 /
# SZ-2053/3077S" kit, GC2053 + Fullhan-class AHD encoder) output AHD
# 1080p at 25fps (PAL), not 30. The driver's compiled-in default is
# fps=30 (AHD_MD=0x02); at that setting these cameras only half-lock
# (NOVID clears but H_LOCK stays 0 — no usable video). fps=25 programs
# AHD_MD=0x03 (1080p25), which gives full lock (NOVID=0 H_LOCK=1
# CMP_LOCK=1 AGC_LOCK=1) and a clean picture — hardware-verified
# 2026-08-25 on input 0 (jack J1 -> /dev/video4). See NOTES.md
# "New SZ-2053/3077S surround-view cameras".
#
# modules-load.d/mycam004m-real.conf autoloads the module via
# systemd-modules-load -> modprobe, which reads this options line.
options mycam004m fps=25
